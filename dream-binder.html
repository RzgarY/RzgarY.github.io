<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DreamBinder</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DreamBinder">
<meta name="theme-color" content="#07080B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080B;--panel:#12151C;--panel2:#191d27;--edge:#2a2f3b;--text:#ECEEF3;--mute:#8A8F9E;--accent:#4ED1B8;--warn:#F2B24C;color-scheme:dark;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(ellipse 70% 55% at 50% 45%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%),var(--bg);color:var(--text);font-family:'Nunito',ui-rounded,'Hiragino Maru Gothic ProN',system-ui,sans-serif}
#app{height:100%;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--text);outline-offset:2px}
header,footer{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(10,12,16,.78);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:5}
header{border-bottom:1px solid var(--edge)}footer{border-top:1px solid var(--edge)}
.brand{display:flex;align-items:center;gap:9px;margin:0;font-size:1.05rem;font-weight:800;min-width:0;flex:1}
.brand i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp{display:flex;gap:6px}
.sep{width:1px;height:26px;background:var(--edge);margin:0 2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:42px;height:42px;padding:0 14px;border-radius:12px;cursor:pointer;font-size:.88rem;font-weight:800;white-space:nowrap;
 background:var(--panel);border:1px solid var(--edge);transition:transform .1s,border-color .2s,background .2s}
.btn:hover{border-color:var(--accent);background:var(--panel2)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn svg{flex:none;width:18px;height:18px;fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06130F}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 85%,#fff)}
.btn.primary svg{stroke:#06130F}
.btn.sm{height:36px;padding:0 12px;font-size:.8rem}
.btn.nav{width:52px}
@media (max-width:860px){header .btn .lbl{display:none}header .btn{padding:0;width:40px;min-width:40px;height:40px}header{gap:6px;padding:8px 10px}.grp{gap:5px}}
@media (max-width:400px){.brand span{display:none}}

#stage{flex:1;position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#zoom{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#book{position:relative;width:calc(var(--pw)*2);height:var(--ph);perspective:2200px}
.pg{position:absolute;left:0;top:0;width:var(--pw);height:var(--ph);background:#fff;box-shadow:0 14px 34px rgba(0,0,0,.65)}
.pg img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
.pg.empty{visibility:hidden}
.pg.l::after,.pg.r::after{content:"";position:absolute;top:0;width:16%;height:100%;pointer-events:none}
.pg.l::after{right:0;background:linear-gradient(to left,rgba(0,0,0,.34),transparent)}
.pg.r::after{left:0;background:linear-gradient(to right,rgba(0,0,0,.34),transparent)}
#leaf{position:absolute;top:0;width:var(--pw);height:var(--ph);transform-style:preserve-3d}
#leaf.fwd{left:var(--pw);transform-origin:0 50%}
#leaf.bwd{left:0;transform-origin:100% 50%}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.face::before{content:"";position:absolute;inset:0;background:#000;opacity:var(--sh,0);z-index:2;pointer-events:none}
#hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--edge);color:var(--mute);font-size:.8rem;font-weight:600;padding:6px 14px;border-radius:99px;transition:opacity .6s;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}

/* footer */
#info{flex:1;min-width:0;background:none;border:0;cursor:pointer;text-align:center;padding:2px 6px;border-radius:10px}
#info:hover{background:rgba(255,255,255,.04)}
#pgtxt{display:block;font-weight:800;font-size:.95rem}
#stat{display:block;white-space:nowrap;font-size:.76rem;color:var(--mute);font-weight:700;margin-top:1px}
.barw{height:4px;border-radius:9px;background:var(--edge);margin:6px auto 0;max-width:280px;overflow:hidden}
#bar,#pbar{height:100%;width:0;background:var(--accent);transition:width .3s}
#jump{width:56px;height:42px;border-radius:12px;border:1px solid var(--edge);background:var(--panel);text-align:center;font-weight:800}

/* page overview */
#grid{position:fixed;inset:0;background:radial-gradient(ellipse 70% 45% at 50% 20%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%),var(--bg);z-index:10;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 16px);display:none}
#grid.open{display:block}
#grid .top{display:flex;justify-content:space-between;align-items:center;margin:0 auto 16px;max-width:900px}
h2{margin:0;font-size:1.15rem;font-weight:800}
#tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;max-width:900px;margin:0 auto}
.tile{position:relative;padding:0;border:1px solid var(--edge);border-radius:12px;overflow:hidden;background:var(--panel);cursor:pointer;transition:transform .2s cubic-bezier(.2,.8,.3,1.4),box-shadow .2s,border-color .2s}
.tile:hover{border-color:var(--accent)}
.tile.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 0 22px color-mix(in srgb,var(--accent) 50%,transparent);transform:translateY(-3px)}
.tile img{display:block;width:100%;height:auto}
.tile b{position:absolute;right:6px;bottom:6px;background:var(--accent);color:#0A0A0F;font-size:.7rem;font-weight:800;padding:1px 8px;border-radius:99px}
.tile .mb{position:absolute;left:6px;bottom:6px;background:var(--warn);color:#201400;font-size:.66rem;font-style:normal;font-weight:800;padding:1px 7px;border-radius:99px}
.tile .mb:empty{display:none}

/* cards panel */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:19;display:none}
#scrim.on{display:block}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);z-index:20;display:flex;flex-direction:column;background:#0d1016;border-left:1px solid var(--edge);
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateX(102%);transition:transform .25s cubic-bezier(.2,.8,.3,1);visibility:hidden}
#panel.open{transform:none;visibility:visible}
#panel .ph{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px}
#panel .pst{padding:0 14px 10px;font-size:.85rem;font-weight:700;color:var(--mute)}
#panel .pst .barw{max-width:none;margin-top:7px}
#q{margin:0 14px;height:42px;border-radius:12px;border:1px solid var(--edge);background:var(--panel);padding:0 14px;min-width:0;width:calc(100% - 28px)}
.chips{display:flex;gap:6px;padding:10px 14px}
.chips button{flex:1;height:34px;border-radius:99px;border:1px solid var(--edge);background:none;font-weight:800;font-size:.82rem;cursor:pointer;color:var(--mute)}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#06130F}
#list{flex:1;overflow-y:auto;list-style:none;margin:0;padding:0 10px 10px;overscroll-behavior:contain}
.row{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.row .go{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;cursor:pointer;padding:4px;border-radius:10px}
.row .go:hover{background:rgba(255,255,255,.05)}
.row .th{flex:none;width:40px;height:56px;border-radius:5px;object-fit:cover;background:var(--panel)}
.row.miss .th{filter:grayscale(1) brightness(.5)}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column}
.row .t b{font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{color:var(--mute);font-size:.74rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .pp{flex:none;font-size:.72rem;font-weight:800;color:var(--mute)}
.row .tg{flex:none;width:78px;height:32px;border-radius:99px;cursor:pointer;font-size:.76rem;font-weight:800;border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.row.miss .tg{border-color:color-mix(in srgb,var(--warn) 60%,transparent);background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.none{padding:30px 10px;text-align:center;color:var(--mute);font-weight:700}
#panel .pf{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 14px;border-top:1px solid var(--edge)}

/* toast + drop */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:40;display:flex;align-items:center;gap:12px;max-width:min(92vw,520px);
 background:#232938;border:1px solid #3a4152;border-radius:14px;padding:10px 12px 10px 16px;font-weight:700;font-size:.88rem;box-shadow:0 12px 30px rgba(0,0,0,.55);transition:opacity .2s,transform .2s}
#toast.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#toast button{flex:none;background:none;border:0;color:var(--accent);font-weight:800;cursor:pointer;padding:6px 8px;border-radius:8px}
#toast button[hidden]{display:none}
#drop{position:fixed;inset:10px;z-index:50;display:none;align-items:center;justify-content:center;pointer-events:none;background:rgba(7,8,11,.88);border:3px dashed var(--accent);border-radius:22px;font-weight:800;font-size:1.3rem}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* binder pages */
.pg{background:#18181b}.pgm{position:relative;aspect-ratio:.72;background:#18181b;container-type:inline-size}.pg{container-type:inline-size}
.bp{position:absolute;inset:0;padding:6.8cqw 4.5cqw;display:grid;grid-template:repeat(var(--r),1fr)/repeat(var(--c),1fr);gap:2.2cqw}
.cell{position:relative;border-radius:2cqw;overflow:hidden;background:#25252b;min-height:0}.cell.empty{background:#1f1f25}
.cell img{position:relative;width:100%;height:100%;object-fit:cover;display:block;transition:filter .2s,opacity .2s}
.cell .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.6cqw;color:#8A8F9E;padding:2px}
.cell.miss img{filter:grayscale(1) brightness(.4);opacity:.5}
.cell.miss::after{content:"MISSING";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-10deg);z-index:1;font-weight:800;font-size:2.3cqw;line-height:1;letter-spacing:.18em;color:#fff;background:rgba(0,0,0,.6);border:.3cqw solid rgba(255,255,255,.45);padding:.9cqw 1.4cqw;border-radius:1cqw;pointer-events:none}
.tile .cell.miss::after{display:none}
.cell.flash{z-index:3;animation:flash .6s ease-in-out 3}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 1.3cqw var(--accent)}}
.tile .pgm{width:100%}
#pr{display:none}
@media print{@page{size:A4;margin:0}html,body{height:auto;overflow:visible;background:#fff}body>*:not(#pr){display:none!important}
#pr{display:block}#pr .ppg{height:297mm;display:flex;align-items:center;justify-content:center;break-after:page;page-break-after:always}
#pr .pgm{width:190mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}#pr .cell,#pr .cell img{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
/* rearrange mode */
.btn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#06130F}.btn[aria-pressed=true] svg{stroke:#06130F}
body.editing .cell[data-id]{cursor:grab}
body.editing #book .cell.empty{outline:.35cqw dashed color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:-.35cqw}
.cell.dragsrc{opacity:.3}
.cell.empty.dragover{outline:.7cqw solid var(--accent);outline-offset:-.7cqw;background:color-mix(in srgb,var(--accent) 22%,#1f1f25)}
.cell.shift{transition:transform .18s ease;z-index:3}
#ghost{position:fixed;left:0;top:0;z-index:60;pointer-events:none;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.7);opacity:.95;will-change:transform}
#ghost img{width:100%;height:100%;object-fit:cover;display:block}
</style>
</head>
<body>
<div id="app">
 <header>
  <h1 class="brand"><i></i><span>DreamBinder</span></h1>
  <div class="grp" role="group" aria-label="File">
   <button class="btn" id="impBtn" title="Import JSON (or drop a file anywhere)" aria-label="Import JSON"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg><span class="lbl">Import JSON</span></button>
   <button class="btn" id="expBtn" title="Export JSON backup" aria-label="Export JSON"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3"/></svg><span class="lbl">Export JSON</span></button>
   <button class="btn primary" id="pdfBtn" title="Export PDF" aria-label="Export PDF"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a1 1 0 00-1 1v16a1 1 0 001 1h10a1 1 0 001-1V7zM14 3v4h4M9 13h6M9 17h6"/></svg><span class="lbl">Export PDF</span></button>
  </div>
  <i class="sep"></i>
  <div class="grp" role="group" aria-label="View">
   <button class="btn" id="editBtn" title="Rearrange cards" aria-label="Rearrange cards" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><span class="lbl">Rearrange</span></button>
   <button class="btn" id="cardsBtn" title="Find cards &amp; missing list" aria-label="Cards"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg><span class="lbl">Cards</span></button>
   <button class="btn" id="gridBtn" title="All pages" aria-label="All pages"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg><span class="lbl">Pages</span></button>
  </div>
  <input type="file" id="impF" accept=".json,application/json" hidden>
 </header>
 <div id="stage"><div id="zoom"><div id="book"><div id="sL" class="pg l"></div><div id="sR" class="pg r"></div></div></div><div id="hint">Drag to turn · tap a card to mark it missing · pinch to zoom</div></div>
 <footer>
  <button class="btn nav" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button id="info" title="Show missing cards"><span id="pgtxt"></span><span id="stat"></span><div class="barw"><div id="bar"></div></div></button>
  <input id="jump" type="number" min="1" aria-label="Go to page" placeholder="#">
  <button class="btn nav" id="next" aria-label="Next"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
 </footer>
</div>
<div id="grid"><div class="top"><h2>All pages</h2><button class="btn" id="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>Close</button></div><div id="tiles"></div></div>
<div id="scrim"></div>
<aside id="panel" aria-label="Cards">
 <div class="ph"><h2>Cards</h2><button class="btn" id="pclose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
 <div class="pst"><span id="pstat"></span><div class="barw"><div id="pbar"></div></div></div>
 <input id="q" type="search" placeholder="Search name, set or number…" autocomplete="off" aria-label="Search cards">
 <div class="chips" id="chips"><button data-f="all" class="on">All</button><button data-f="miss">Missing</button><button data-f="have">Owned</button></div>
 <ul id="list"></ul>
 <div class="pf">
  <button class="btn sm" id="wCopy">Copy missing list</button><button class="btn sm" id="wDl">Download .txt</button>
  <button class="btn sm" id="wClr">Clear all missing</button><button class="btn sm" id="wRst">Reset binder</button>
 </div>
</aside>
<div id="drop">Drop a binder .json to import</div>
<div id="toast" role="status"><span id="tmsg"></span><button id="tact" hidden></button></div>
<script>
let D={"name":"Binder","rows":3,"cols":3,"pages":[{"id":"pg_0","cards":{},"blocks":[]}],"images":{}},N=D.pages.length;const $=id=>document.getElementById(id);
let ORIG=null;
let drag=null,editMode=false,hintT;
function vis(p){const cov=new Set();p.blocks.forEach(b=>{for(let y=0;y<b.h;y++)for(let x=0;x<b.w;x++)cov.add((b.r+y)+','+(b.c+x))});return Object.entries(p.cards).filter(([k])=>!cov.has(k)).map(([k,c])=>c)}
let SP,PRES;function buildSP(){SP=[];for(let i=0;i<N;i+=2)SP.push([i,i+1<N?i+1:null]);PRES=new Set(D.pages.flatMap(p=>vis(p).map(c=>c.id)))}buildSP();
const stage=$('stage'),zoom=$('zoom'),book=$('book'),sL=$('sL'),sR=$('sR');
let sp=0,S=1,TX=0,TY=0,pw=0,ph=0,fl=null,anim=0;
const off=s=>0;
const save=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},load=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
let MISS=new Set(JSON.parse(load('binder-miss')||'[]'));
const idb=()=>new Promise((res,rej)=>{const q=indexedDB.open('dreambinder',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>res(q.result);q.onerror=()=>rej()});
const idbSet=v=>(save('binder-dirty','1'),idb()).then(d=>d.transaction('k','readwrite').objectStore('k').put(v,'D')).catch(()=>{});
const idbGet=()=>idb().then(d=>new Promise(r=>{const q=d.transaction('k').objectStore('k').get('D');q.onsuccess=()=>r(q.result);q.onerror=()=>r()})).catch(()=>null);
let EXT={};try{EXT=JSON.parse(load('binder-ext')||'{}')}catch(e){}
function cimg(src,lo){const i=new Image(),pn=EXT[src]==='png',w=src+(lo?'/low.webp':'/high.webp'),p=src+(lo?'/low.png':'/high.png'),u=pn?[p,w]:[w,p];let n=0;i.onload=()=>{if(!pn&&i.src.endsWith('.png')){EXT[src]='png';save('binder-ext',JSON.stringify(EXT))}};i.draggable=false;if(lo)i.loading='lazy';i.src=u[0];i.onerror=()=>{if(++n<2)i.src=u[1];else i.style.visibility='hidden'};return i}
function pageDom(i,lo){const S=D,p=S.pages[i],el=document.createElement('div');el.className='bp';el.style.setProperty('--r',S.rows);el.style.setProperty('--c',S.cols);
 const cov=new Set();p.blocks.forEach(b=>{for(let y=0;y<b.h;y++)for(let x=0;x<b.w;x++)cov.add((b.r+y)+','+(b.c+x))});
 for(let r=0;r<S.rows;r++)for(let c=0;c<S.cols;c++){const k=r+','+c,cell=document.createElement('div');cell.className='cell';cell.dataset.p=i;cell.dataset.k=k;
  const b=p.blocks.find(b=>b.r==r&&b.c==c);
  if(b){cell.classList.add('blk');cell.style.gridArea=`${r+1}/${c+1}/span ${b.h}/span ${b.w}`;const im=new Image();im.src=S.images[b.imageId]||'';im.draggable=false;cell.append(im);el.append(cell);continue}
  if(cov.has(k))continue;const cd=p.cards[k];
  if(!cd){cell.classList.add('empty');el.append(cell);continue}
  cell.dataset.id=cd.id;cell.title=cd.name;if(drag&&drag.started&&drag.p===i&&drag.k===k)cell.classList.add('dragsrc');if(MISS.has(cd.id))cell.classList.add('miss');
  const f=document.createElement('span');f.className='fb';f.textContent=cd.name;cell.append(f,cimg(cd.image,lo));el.append(cell)}
 return el}
function fill(c,i){c.textContent='';c.classList.toggle('empty',i==null);if(i!=null)c.appendChild(pageDom(i))}
function tapCard(e){const x=document.elementFromPoint(e.clientX,e.clientY),z=x&&x.closest&&x.closest('#book .cell');if(!z||fl||z.closest('#leaf'))return;

 fl.finishing=true;const s=fl.p,e=ok?1:0,dur=Math.max(150,Math.abs(e-s)*(fast?380:600)),t0=performance.now();

 (function step(now){const u=Math.min(1,(now-t0)/dur),q=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;setP(s+(e-s)*q);

});

});

   if(now-lastTap<300){S>1.02?layout():zoomAt(e.clientX-r.left,e.clientY-r.top,2.4);apply(true);lastTap=0}else lastTap=now}

}

function editStart(e){

 stage.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});$('hint').style.opacity=0;g=null;
 drag={pid:e.pointerId,p:+c.dataset.p,k:c.dataset.k,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,started:false,el:c,tgt:null,gh:null,et:0,es:0};
 return true}
function dragMove(e){

 if(!d.started){if(Math.hypot(d.x-d.sx,d.y-d.sy)<7)return;startGhost()}

 i2.src=im?(im.currentSrc||im.src):'';i2.draggable=false;gh.append(i2);document.body.append(gh);

function cellAt(){
 if(fl)return null;const d=drag,x=document.elementFromPoint(d.x,d.y),c=x&&x.closest&&x.closest('#book .cell[data-k]');
 if(!c||c.classList.contains('blk')||c.closest('#leaf'))return null;

 const ia=a.dataset.id,ib=b.dataset.id,ta=a.title,tb=b.title,ma=a.classList.contains('miss'),mb=b.classList.contains('miss'),ea=a.classList.contains('empty'),eb=b.classList.contains('empty');
 const set=(el,id,t,m,e)=>{if(id)el.dataset.id=id;else delete el.dataset.id;el.title=t||'';el.classList.toggle('miss',m);el.classList.toggle('empty',e)};

// swaps the contents of two slots (an empty slot counts), so the displaced card lands in the slot that was just vacated
function applyMove(ps,ks,pt,kt,isUndo){
 if(D===ORIG)D={...D,pages:D.pages.map(p=>({...p,cards:{...p.cards}}))};

$('close').onclick=closeAll;
const hp=()=>{const m=/^#page-(\d+)$/.exec(location.hash);return m?+m[1]-1:null};
window.addEventListener('hashchange',()=>{const h=hp();if(h!=null&&!SP[sp].includes(h))jump(h)});
jump(0);boot();
setTimeout(()=>{$('hint').style.opacity=0},5000);

// ===== load binder.json from the repo (source of truth) =====
const okJ=j=>j&&j.state&&Array.isArray(j.state.pages);
function applyRemote(j){j.state.pages.forEach(p=>{p.cards=p.cards||{};p.blocks=p.blocks||[]});
  const used=new Set(j.state.pages.flatMap(p=>p.blocks.map(b=>b.imageId))),im={};for(const k in j.images||{})if(used.has(k))im[k]=j.images[k];
  D={name:j.state.name,rows:j.state.rows,cols:j.state.cols,pages:j.state.pages,images:im};
  MISS=new Set(j.missing||[]);persist();idbSet(D);save('binder-base',j.exported||'');save('binder-dirty','0');applyData()}
async function boot(force){
  let rem=null;try{const r=await fetch('binder.json',{cache:'no-cache'});if(r.ok)rem=await r.json()}catch(e){}
  const loc=await idbGet(),ver=okJ(rem)?(rem.exported||''):null,dirty=load('binder-dirty')==='1';
  if(okJ(rem)){let use=force||!(loc&&loc.pages)||load('binder-base')!==ver;
    if(use&&!force&&loc&&loc.pages&&dirty&&!confirm('A newer binder.json was found in the repo.\n\nOK = load it (this browser\'s edits and missing marks are replaced)\nCancel = keep this browser\'s version'))use=false;
    if(use){applyRemote(rem);toast(force?'Reloaded binder.json':'Loaded binder.json')}
    else{save('binder-base',ver);if(loc&&loc.pages){D=loc;applyData()}}
  }else if(loc&&loc.pages){D=loc;applyData();toast('Offline — showing the last saved binder')}
  else toast('Could not load binder.json — import a JSON file instead')}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

// ===== add / remove image blocks in empty slots =====
const rid=p=>p+'_'+Math.random().toString(36).slice(2,12),CARD_AR=734/1024;
function emptyAt(p,r,c){if(r<0||c<0||r>=D.rows||c>=D.cols)return false;const k=r+','+c;if(p.cards[k])return false;return !p.blocks.some(b=>r>=b.r&&r<b.r+b.h&&c>=b.c&&c<b.c+b.w)}
function sizesAt(p,r,c){const o=[];for(let h=1;r+h<=D.rows;h++)for(let w=1;c+w<=D.cols;w++){let ok=true;for(let y=0;y<h&&ok;y++)for(let x=0;x<w;x++)if(!emptyAt(p,r+y,c+x)){ok=false;break}if(ok)o.push([w,h])}return o}
function refreshAll(){fill(sL,SP[sp][0]);fill(sR,SP[sp][1]);buildTiles();refreshStats()}
function imgTap(pi,k,isBlk){const p=D.pages[pi],[r,c]=k.split(',').map(Number);
  if(isBlk){const b=p.blocks.find(b=>b.r===r&&b.c===c);if(b&&confirm('Remove this image?')){p.blocks=p.blocks.filter(x=>x!==b);delete D.images[b.imageId];idbSet(D);refreshAll();toast('Image removed')}return}
  const sz=sizesAt(p,r,c);if(sz.length)cropDlg(pi,r,c,sz)}
function cropDlg(pi,r,c,sizes){
  let [w,h]=sizes.reduce((a,b)=>b[0]*b[1]>a[0]*a[1]?b:a);let img=null,z=1,ox=0,oy=0;
  const m=document.createElement('div');m.style.cssText='position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:12px';
  m.innerHTML='<div style="background:var(--panel);border:1px solid var(--edge);border-radius:16px;padding:14px;width:min(380px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px"><b>Add image</b><div id="cz" style="display:flex;gap:6px;flex-wrap:wrap"></div><canvas id="cv" style="width:100%;border-radius:10px;background:#000;touch-action:none"></canvas><input id="cr" type="range" min="1" max="4" step="0.01" value="1" aria-label="Zoom"><div style="display:flex;gap:8px"><button class="btn sm" id="cp" style="flex:1">Choose photo</button><button class="btn sm" id="cx">Cancel</button><button class="btn sm primary" id="ca" disabled>Add</button></div><input id="cf" type="file" accept="image/*" hidden></div>';
  document.body.append(m);const q=s=>m.querySelector(s),cv=q('#cv'),ctx=cv.getContext('2d');
  const ar=()=>(w/h)*CARD_AR;
  function draw(){const W=cv.width=640,H=cv.height=Math.round(640/ar());ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);if(!img)return;
    const s=Math.max(W/img.width,H/img.height)*z,dw=img.width*s,dh=img.height*s;ox=Math.min(0,Math.max(W-dw,ox));oy=Math.min(0,Math.max(H-dh,oy));ctx.drawImage(img,ox,oy,dw,dh)}
  function chips(){const box=q('#cz');box.textContent='';sizes.forEach(([a,b])=>{const t=document.createElement('button');t.className='btn sm'+(a===w&&b===h?' primary':'');t.textContent=a+'×'+b;t.onclick=()=>{w=a;h=b;ox=oy=0;chips();draw()};box.append(t)})}
  chips();draw();
  q('#cp').onclick=()=>q('#cf').click();q('#cx').onclick=()=>m.remove();
  q('#cf').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{img=i;z=1;ox=oy=0;q('#cr').value=1;q('#ca').disabled=false;draw();URL.revokeObjectURL(u)};i.src=u};
  q('#cr').oninput=e=>{const W=cv.width,H=cv.height,o=Math.max(W/img.width,H/img.height),cx=(W/2-ox)/(img.width*o*z),cy=(H/2-oy)/(img.height*o*z);z=+e.target.value;ox=W/2-cx*img.width*o*z;oy=H/2-cy*img.height*o*z;draw()};
  let pd=null;cv.onpointerdown=e=>{if(!img)return;cv.setPointerCapture(e.pointerId);pd={x:e.clientX,y:e.clientY,ox,oy}};
  cv.onpointermove=e=>{if(!pd)return;const k=cv.width/cv.getBoundingClientRect().width;ox=pd.ox+(e.clientX-pd.x)*k;oy=pd.oy+(e.clientY-pd.y)*k;draw()};cv.onpointerup=cv.onpointercancel=()=>{pd=null};
  q('#ca').onclick=()=>{const OW=w*600,OH=Math.round(OW/ar()),o=document.createElement('canvas');o.width=OW;o.height=OH;draw();o.getContext('2d').drawImage(cv,0,0,OW,OH);
    const url=o.toDataURL('image/jpeg',.86),imageId=rid('img'),p=D.pages[pi];
    p.blocks.push({id:rid('blk'),r,c,w,h,imageId,srcId:rid('src'),crop:{x:0,y:0,width:OW,height:OH,rotate:0,scaleX:1,scaleY:1}});D.images=D.images||{};D.images[imageId]=url;
    m.remove();idbSet(D);refreshAll();toast('Image added — Export to save it to your repo')}}
</script>
<div id="pr"></div></body>

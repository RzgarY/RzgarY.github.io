<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rzgary Hub</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- Reset & Base Styles --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050508;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(76, 29, 149, 0.3) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(30, 58, 138, 0.3) 0%, transparent 40%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* --- Header Section --- */
        header {
            text-align: center;
            margin-bottom: 50px;
        }

        .logo-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #a78bfa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.5));
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 15px;
        }

        h1 span {
            background: linear-gradient(to right, #ffffff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            color: #94a3b8;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle::before,
        .subtitle::after {
            content: "";
            display: block;
            width: 60px;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }

        /* --- Cards Container --- */
        .card-container {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1200px;
            width: 100%;
        }

        /* --- Individual Card Styles --- */
        .card {
            background: rgba(20, 20, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 30px;
            width: 320px;
            text-align: center;
            text-decoration: none;
            color: white;
            transition: all 0.3s ease;
            position: relative;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Hover Effects & Glows */
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* Specific Card Borders/Colors */
        .card.portfolio:hover {
            border-color: #3b82f6;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.2);
        }

        .card.pokecollect:hover {
            border-color: #a855f7;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.2);
        }

        .card.ironledger:hover {
            border-color: #10b981;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
        }

        .icon-wrapper {
            font-size: 3rem;
            margin-bottom: 20px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Custom Colors for Icons */
        .portfolio .icon-wrapper { color: #e2e8f0; }
        .pokecollect .icon-wrapper { color: #f87171; } /* Redish for Pokeball top */
        .ironledger .icon-wrapper { color: #e2e8f0; }

        .card h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .card p {
            color: #94a3b8;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 30px;
            flex-grow: 1;
        }

        .arrow-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            margin-top: auto;
        }

        .card:hover .arrow-circle {
            background: rgba(255, 255, 255, 0.1);
            border-color: white;
        }

        /* --- Footer --- */
        footer {
            margin-top: 80px;
            color: #64748b;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        footer i {
            color: #8b5cf6;
        }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .card-container { flex-direction: column; align-items: center; }
            .card { width: 100%; max-width: 350px; }
            .subtitle::before, .subtitle::after { width: 30px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-icon">
            <i class="fa-solid fa-star-of-life fa-spin"></i>
        </div>
        <h1>RzgAry <span>Hub</span></h1>
        <div class="subtitle">Explore my projects</div>
    </header>

    <main class="card-container">

        <!-- Portfolio Card -->
        <a href="https://rzgary.github.io/Portfolio" target="_blank" class="card portfolio">
            <div class="icon-wrapper">
                <i class="fa-solid fa-laptop-code"></i>
            </div>
            <h2>Portfolio</h2>
            <p>My personal portfolio website showcasing my skills and work.</p>
            <div class="arrow-circle">
                <i class="fa-solid fa-arrow-right"></i>
            </div>
        </a>

        <!-- PokeCollect Card -->
        <a href="https://rzgary.github.io/PokeCollect/" target="_blank" class="card pokecollect">
            <div class="icon-wrapper">
                <i class="fa-solid fa-circle-half-stroke"></i>
            </div>
            <h2>PokeCollect</h2>
            <p>A Pokédex for all Pokémon. Gotta catch 'em all.</p>
            <div class="arrow-circle">
                <i class="fa-solid fa-arrow-right"></i>
            </div>
        </a>

        <!-- IronLedger Card -->
        <a href="https://rzgary.github.io/IronLedger/" target="_blank" class="card ironledger">
            <div class="icon-wrapper">
                <i class="fa-solid fa-dumbbell"></i>
            </div>
            <h2>IronLedger</h2>
            <p>Track your gym progress and manage your workout routines.</p>
            <div class="arrow-circle">
                <i class="fa-solid fa-arrow-right"></i>
            </div>
        </a>

    </main>

    <footer>
        Built with passion <i class="fa-solid fa-heart"></i>
    </footer>

</body>
</html>
